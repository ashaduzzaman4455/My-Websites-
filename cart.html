<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — GlowMart</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="main-header">
    <div class="container nav-wrap">
      <a href="index.html" class="logo"><i class="fas fa-bolt"></i><span>Glow<em>Mart</em></span></a>
      <div class="nav-actions" style="margin-left:auto;">
        <button class="icon-btn" id="darkModeBtn"><i class="fas fa-moon"></i></button>
        <a href="wishlist.html" class="icon-btn"><i class="far fa-heart"></i><span class="badge" id="wishlistCount">0</span></a>
        <a href="cart.html" class="icon-btn"><i class="fas fa-shopping-bag"></i><span class="badge" id="cartCount">0</span></a>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 40px 20px;">
    <div class="page-header">
      <h1><i class="fas fa-shopping-bag"></i> Your Shopping Cart</h1>
    </div>

    <div class="cart-layout">
      <div class="cart-items" id="cartItems"></div>
      
      <aside class="cart-summary">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
        <div class="summary-row"><span>Shipping</span><strong id="shipping">$0.00</strong></div>
        <div class="summary-row"><span>Tax (5%)</span><strong id="tax">$0.00</strong></div>
        <div class="summary-row total"><span>Total</span><strong id="total">$0.00</strong></div>
        
        <div class="coupon-box">
          <input type="text" id="couponInput" placeholder="Coupon code">
          <button id="applyCoupon">Apply</button>
        </div>
        
        <a href="checkout.html" class="btn-primary" style="width:100%;justify-content:center;margin-top:20px;">
          Proceed to Checkout <i class="fas fa-arrow-right"></i>
        </a>
        
        <a href="shop.html" class="btn-ghost" style="width:100%;justify-content:center;margin-top:10px;">
          Continue Shopping
        </a>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border:none;padding:0;"><span>© 2026 GlowMart. All rights reserved.</span></div>
    </div>
  </footer>

  <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMsg">Added</span></div>

  <script src="products-data.js"></script>
  <script src="auth.js"></script>
  <script src="cart.js"></script>
  <script src="script.js"></script>
  <script>
    (function() {
      const itemsEl = document.getElementById('cartItems');
      const subtotalEl = document.getElementById('subtotal');
      const shippingEl = document.getElementById('shipping');
      const taxEl = document.getElementById('tax');
      const totalEl = document.getElementById('total');

      function render() {
        const cart = window.GlowCart.getCart();
        
        if (cart.length === 0) {
          itemsEl.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-shopping-bag"></i>
              <h3>Your cart is empty</h3>
              <p>Start shopping to add items to your cart</p>
              <a href="shop.html" class="btn-primary" style="margin-top:20px;display:inline-flex;">Shop Now</a>
            </div>`;
          subtotalEl.textContent = '$0.00';
          shippingEl.textContent = '$0.00';
          taxEl.textContent = '$0.00';
          totalEl.textContent = '$0.00';
          return;
        }
        
        let subtotal = 0;
        itemsEl.innerHTML = cart.map(item => {
          const p = window.PRODUCTS.find(x => x.id === item.id);
          if (!p) return '';
          subtotal += p.price * item.qty;
          return `
            <div class="cart-item">
              <div class="cart-item-image"><i class="fas ${p.icon}"></i></div>
              <div class="cart-item-info">
                <h4>${p.name}</h4>
                <p>${p.desc}</p>
                <div class="cart-item-actions">
                  <div class="qty-control">
                    <button class="qty-btn" data-id="${p.id}" data-action="dec">−</button>
                    <span>${item.qty}</span>
                    <button class="qty-btn" data-id="${p.id}" data-action="inc">+</button>
                  </div>
                  <button class="remove-btn" data-id="${p.id}"><i class="fas fa-trash"></i> Remove</button>
                </div>
              </div>
              <div class="cart-item-price">$${(p.price * item.qty).toFixed(2)}</div>
            </div>`;
        }).join('');
        
        const shipping = subtotal > 50 ? 0 : 5.99;
        const tax = subtotal * 0.05;
        const total = subtotal + shipping + tax;
        
        subtotalEl.textContent = '$' + subtotal.toFixed(2);
        shippingEl.textContent = shipping === 0 ? 'FREE' : '$' + shipping.toFixed(2);
        taxEl.textContent = '$' + tax.toFixed(2);
        totalEl.textContent = '$' + total.toFixed(2);
      }

      itemsEl.addEventListener('click', e => {
        const btn = e.target.closest('[data-action], .remove-btn');
        if (!btn) return;
        const id = Number(btn.dataset.id);
        
        if (btn.classList.contains('remove-btn')) {
          window.GlowCart.remove(id);
          window.showToast('Item removed from cart', 'fa-trash');
          render();
        } else if (btn.dataset.action === 'inc') {
          const item = window.GlowCart.getCart().find(x => x.id === id);
          window.GlowCart.updateQty(id, item.qty + 1);
          render();
        } else if (btn.dataset.action === 'dec') {
          const item = window.GlowCart.getCart().find(x => x.id === id);
          if (item.qty > 1) {
            window.GlowCart.updateQty(id, item.qty - 1);
          } else {
            window.GlowCart.remove(id);
          }
          render();
        }
      });

      document.getElementById('applyCoupon').addEventListener('click', () => {
        const code = document.getElementById('couponInput').value.trim().toUpperCase();
        if (code === 'SAVE10') {
          window.showToast('Coupon applied! 10% off', 'fa-ticket');
        } else {
          window.showToast('Invalid coupon code', 'fa-times-circle');
        }
      });

      render();
    })();
  </script>
</body>
</html>
